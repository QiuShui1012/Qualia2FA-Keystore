# cargo-deny configuration.
#
# This crate holds platform keystore handles directly and compiles in `unsafe`
# FFI calls, so every extra dependency is extra attack surface. Dependency
# auditing is therefore a security control here, not a chore.
#
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Evaluates dependencies per target platform. A backend dependency
# (`windows-sys`) takes effect on one target only, and evaluating everything
# together would attribute Windows-only dependencies to other platforms.
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-linux-android" },
    { triple = "aarch64-apple-ios" },
]
# Dev-dependencies and optional features (`mock` pulls in `p256`) are audited
# too: they do not reach the artifact, but they can carry vulnerabilities into
# the CI environment.
all-features = true

[advisories]
version = 2
ignore = [
    # List advisories that have to be accepted temporarily here, with a **reason
    # and an expiry date**, for example:
    # { id = "RUSTSEC-0000-0000", reason = "no exploitable path, waiting for the upstream 0.3.x fix (review: 2026-12-31)" },
]

[licenses]
version = 2
# This crate is released under LGPL-3.0-or-later and is an **independently
# reusable** library: any project that needs a P-256 identity key pair inside
# platform hardware can use it. The allow list therefore follows this crate's own
# dependency tree, not a downstream crate's.
#
# Note: GPL-2.0-only / SSPL / BUSL and other licenses that are incompatible with
# LGPL-3.0 or non-free are **not** included.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# The allow list is opened **in advance** for platform backends to be added
# later, so a number of licenses are currently used by no dependency. "allowed
# license not encountered" is therefore downgraded to allowed, so that adding a
# dependency does not drown in noise.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Explicitly banned crates and the reason for each.
#
# The focus here is the **platform abstraction layer** rather than cryptographic
# implementations: this crate needs a key that can live in hardware and whose
# private half cannot be exported, so any scheme that does not meet that must not
# appear in the dependency graph.
deny = [
    # Archived; see the `p256` crate's own note.
    { name = "pqcrypto" },
    { name = "pqcrypto-kyber" },
    { name = "pqcrypto-dilithium" },
    { name = "pqc_kyber" },
    { name = "cosmian_kyber" },
    { name = "libcrux-kem" },
    { name = "libcrux-aesgcm" },
    # CPace: no usable implementation in the Rust ecosystem.
    { name = "cpace" },
    { name = "pake-cpace" },
    # Merged into `aes`.
    { name = "aes-soft" },
    { name = "aesni" },
    # `rand`'s default thread RNG (`ThreadRng`) is unsuitable for generating key
    # material: it makes no cryptographic guarantees and is not consistent across
    # platforms. This crate always takes randomness straight from the OS through
    # `getrandom`, so `rand` is kept out.
    #
    # Note: `p256` is used in this crate only by the `mock` backend (pure software
    # signing), and deliberately does **not** enable the `arithmetic` /
    # `rand_core` features, so it does not pull `rand` in.
    { name = "rand" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
