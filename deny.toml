# cargo-deny 配置。
#
# 本 crate 直接持有平台密钥库的句柄、并编译进 `unsafe` 的 FFI 调用，多出来的每一个
# 依赖都是额外的攻击面。因此依赖审计在这里同样是安全控制，不是杂事。
#
# 参考：https://embarkstudios.github.io/cargo-deny/

[graph]
# 按目标平台分别评估依赖。平台后端的依赖（`windows-sys`）只在一个目标上生效，
# 混在一起评估会把 Windows 专有依赖算到别的平台上。
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-linux-android" },
    { triple = "aarch64-apple-ios" },
]
# 开发依赖与可选 feature（`mock` 会拉进 `p256`）也要审：它们不进产物，但可能带着
# 漏洞进 CI 环境。
all-features = true

[advisories]
version = 2
ignore = [
    # 如有必须暂时接受的公告，在此列出并**附上理由与到期时间**，例如：
    # { id = "RUSTSEC-0000-0000", reason = "无可利用路径，等上游 0.3.x 修复（复审：2026-12-31）" },
]

[licenses]
version = 2
# 本 crate 以 LGPL-3.0-or-later 发布，是一个**独立可复用**的库：任何需要「平台硬件里
# 一对 P-256 身份密钥」的项目都能用它。因此允许清单按自己的依赖树给，而不是照抄
# 某个下游——照抄会让下游换一个依赖时这里莫名其妙地过不了。
#
# 注意：**不包含** GPL-2.0-only / SSPL / BUSL 等与 LGPL-3.0 不兼容或非自由的许可证。
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# 白名单是**预先**为后续要引入的平台后端放行的，因此当前必然有一批许可证尚未被
# 任何依赖用到。故把「白名单条目未命中」降级为允许，避免每次加依赖前都被噪音淹没。
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

# 明确禁止的 crate 及其理由。
#
# 这里的重点是**平台抽象层**而不是密码学实现：本 crate 需要的是
# 「能进硬件、且私钥导不出来」，任何不符合这一点的方案都不该出现在依赖里。
deny = [
    # 已归档，见 `p256` crate 自身的说明。
    { name = "pqcrypto" },
    { name = "pqcrypto-kyber" },
    { name = "pqcrypto-dilithium" },
    { name = "pqc_kyber" },
    { name = "cosmian_kyber" },
    { name = "libcrux-kem" },
    { name = "libcrux-aesgcm" },
    # CPace：Rust 生态无可用实现。
    { name = "cpace" },
    { name = "pake-cpace" },
    # 已并入 `aes`。
    { name = "aes-soft" },
    { name = "aesni" },
    # `rand` 的默认线程 RNG（`ThreadRng`）不适合生成密钥材料——它不保证密码学
    # 安全性，也不是跨平台一致的。本 crate 一律用 `getrandom` 直接向操作系统取
    # 随机数，所以把 `rand` 挡在门外，免得有人图省事引入。
    #
    # 注意：`p256` 在本 crate 里只用于 `mock` 后端（纯软件签名），且刻意**不开**
    # `arithmetic` / `rand_core` 相关 feature，因此它不会把 `rand` 拖进来。
    { name = "rand" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
