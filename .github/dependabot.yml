# Dependabot keeps the dependency graph moving without a red CI being the thing
# that announces an update. The gate stays where it is: `cargo-deny-action` in the
# CI workflow decides whether a new version may enter the lockfile, and the test
# suite decides whether it works. This file only decides when the question is
# asked, and the answer is "as a pull request, not as a broken main branch".
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # A conventional-commit prefix, because that is what this repository's history
    # uses and a squashed Dependabot pull request is a commit like any other.
    commit-message:
      prefix: build
      include: scope
    # Grouped so that a week of patch releases is one pull request to review rather
    # than ten. Security updates are deliberately not grouped: those arrive as their
    # own pull request, which is the point of having them.
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # `jni` is not a dependency this repository may move on its own. The Android keystore
    # backend is written against the 0.21 API: `JNIEnv` passed as `&mut`, object handles
    # carrying a local-frame lifetime, `GlobalRef`/`AutoLocal`, object references borrowed
    # into `JValue`. 0.22 reworks exactly those types - `JNIEnv` split into `EnvUnowned`
    # and `Env`, `Env` borrowable only from an `AttachGuard`, `GlobalRef` replaced by
    # `Global`, `JValueGen` removed, several calls made fallible - and it lands as 114
    # compile errors across `src/keystore/platform/android.rs` and
    # `src/keystore/platform/android/java.rs`. That port has to be verified against a real
    # Android keystore, so it is a deliberate change rather than a weekly proposal, and
    # patch releases inside the 0.21 line are not affected by this rule.
    #
    # Security updates are not affected by `ignore` either (Dependabot opens those
    # regardless), so an advisory against the pinned version still arrives - as it should,
    # because a security fix and a port to a new API are then the same decision.
    ignore:
      - dependency-name: "jni"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"