name: Publish

# 只在打 `v*` 标签时发布。
#
# 刻意**不**在 push 到 master 时发布：crates.io 的发布是**不可撤销**的，一个版本号
# 一旦占位就永久存在（yank 只会阻止新的依赖解析，不会让已下载的人消失）。因此发布
# 必须是一个显式动作，而不是「合并到主分支」的副作用。
on:
  push:
    tags:
      - 'v*'
  # 允许手动触发一次 dry-run，用来检查打包结果而不真的发布。
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # 先验证：标签里的版本号必须与 Cargo.toml 一致，且必须在所有目标平台上能打包。
  #
  # 为什么要在**所有**目标平台上验证：`cargo publish` 默认只检查当前平台的构建。
  # 一份在 Linux 上打得出来的包，可能在 Windows 上因为 `cfg` 分支里的路径写错而
  # 打包失败——而那时版本号已经用掉了。
  verify:
    name: Verify packaging
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 Cargo.toml 里的版本 $manifest 不一致"
            exit 1
          fi

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: verify
    # 手动触发（workflow_dispatch）只跑验证，不发布。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # `GITHUB_TOKEN` 默认是只读的，而最后那一步要建 Release。
    # 显式声明最小权限：只需要写仓库内容，别的都不需要。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        # 密钥来自仓库 secret，只在发布这一步注入——验证任务里用不到它，
        # 因此它不该出现在那些任务的运行环境里。
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_PUBLISH_KEY }}
        run: cargo publish --locked

      - name: Tag the published commit
        # `cargo publish` **已经成功**才走到这里（上一步失败会直接中止 job）。
        #
        # # 这一步刻意不写 `set -e`
        #
        # 发布是**不可撤销**的，因此「已经发到 crates.io、只是 GitHub Release 没建成」
        # 绝不能让整个 job 变红——那会让人以为发布失败了。第一次跑就撞上这件事：
        # `contents: write` 没声明，`gh release create` 报 403，job 红了，而 crate
        # 其实已经上线。
        #
        # 因此这里把失败降级成一条**警告**，并且只影响「GitHub 上有没有那个 Release」
        # 这一件纯装饰性的事。
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release create "$GITHUB_REF_NAME" \
               --title "$GITHUB_REF_NAME" \
               --notes "Published to crates.io as \`qualia-dik\`." \
               --verify-tag; then
            echo "已创建 GitHub Release $GITHUB_REF_NAME"
          else
            echo "::warning::crate 已成功发布到 crates.io，但 GitHub Release 创建失败（通常是因为 workflow 缺少 contents: write 权限）。这不影响发布结果。"
          fi
