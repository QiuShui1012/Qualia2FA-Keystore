name: CI

# 说明：本仓库根目录即 crate 根（crate `qualia-dik`），所有 job 都在仓库根执行。
#
# 本 crate 的职责是「设备身份」而不是协议逻辑，因此 CI 的重点与上层不同：
#   1. 确认 Windows 后端**真的能编译**——`unsafe` 面与平台 API 的绑定只在这里
#      才会被编译器检查，而它无法在 Linux 上验证
#   2. 确认**非 Windows 平台也能构建**——各后端都由 `cfg` 收窄，写错一个条件
#      会让别的平台编译失败，而那要到端侧构建时才发现，代价很高
#   3. 确认 mock feature 组合可用——上层的测试依赖它
#   5. 确认文档示例在 mock 下真的能跑（cargo test --doc --features mock）
#   4. 确认 MSRV 仍然成立

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  # ── 第一关：格式、lint、测试（Windows：唯一有后端实现的平台） ──────────────
  check-windows:
    name: fmt + clippy + test（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4



      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # 本 crate 是唯一允许 unsafe 的地方，而 CI 的 -D warnings 会把
      # `undocumented_unsafe_blocks` 与 `unsafe_op_in_unsafe_fn` 上升为错误：
      # 每个 unsafe 块都必须写明为什么它的不变式成立。
      - name: cargo clippy（-D warnings）
        run: cargo clippy --all-targets -- -D warnings

      # 含真实 TPM 的集成测试。GitHub 的 Windows runner 通常**没有** TPM，
      # 那些测试会打印原因并跳过而不是失败——所以这个 job 即使在无 TPM 的机器
      # 上也是绿的，而「跳过」与「通过」在日志里区分得开。
      - name: cargo test
        run: cargo test --all-targets

      - name: cargo doc（不得有警告）
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # 文档示例里的后端是 `MockKeyStore`，而它只在 `mock` feature 下存在。
      # 因此示例必须在**开启该 feature** 时才真的被编译——默认那次运行会跳过它，
      # 于是「示例写错了」这件事在这里才暴露。
      - name: cargo test --doc --features mock
        run: cargo test --doc --features mock

  # ── 第二关：非 Windows 平台必须也能构建 ────────────────────────────────────
  # 各后端都由 `cfg` 收窄。这一关专门证明「在没有任何平台后端的机器上，本 crate
  # 仍然能编译并通过与硬件无关的测试」——包括 `mock` 后端与抽象层自身。
  check-linux:
    name: 非 Windows 平台构建 + mock 后端测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy（-D warnings）
        run: cargo clippy --all-targets -- -D warnings

      # 在 Linux 上，`mock` 是**唯一**可用的后端。跑它既验证了抽象层可用，
      # 也验证了 cfg 收窄没有把非 Windows 平台写坏。
      - name: cargo test --features mock
        run: cargo test --features mock --all-targets

  # ── 第三关：MSRV ──────────────────────────────────────────────────────────
  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      # MSRV 用**真实工具链**验证，而不是相信 `rust-version` 字段。
      # Linux 上跑是为了省时间：MSRV 关心的是语言与依赖特性，与平台后端无关，
      # 而平台后端的编译由 Windows job 覆盖。
      - name: 安装 1.89 工具链
        run: rustup toolchain install 1.89 --profile minimal

      - name: cargo +1.89 check（含 mock feature）
        run: cargo +1.89 check --all-targets --features mock

  # ── 第四关：依赖审计 ──────────────────────────────────────────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      # 本 crate 直接持有平台密钥库句柄，多出来的依赖都是攻击面。
      - name: 安装 cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check
