[package]
name = "qualia-dik"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
license = "LGPL-3.0-or-later"
description = "Device identity kit: P-256 device identity primitives and platform-native, hardware-backed keystores."
repository = "https://github.com/Qualia2FA/QualiaDeviceIdentityKit"
keywords = ["ecdsa", "p256", "keystore", "tpm", "identity"]
categories = ["cryptography", "hardware-support"]
readme = "README.md"
# CI configuration and the dependency audit manifest are not part of the
# published package: they are meaningless to users, and the size and contents of
# a crates.io package are publicly visible.
exclude = ["/.github", "/deny.toml"]

# This crate is the **only** place where `unsafe` is allowed, and the only place
# that may touch platform-native APIs (Windows CNG, Android Keystore, ...).
#
# It does exactly two things:
#
# 1. **Public half of the device identity** (`src/device.rs`): representation,
#    fingerprint, verification. It holds no private key and does not sign.
# 2. **Platform keystore calls** (`src/keystore.rs`): key generation, public key
#    retrieval, message signing.
#
# Both halves live in one crate because they are the two halves of a single
# concept, device identity.
#
# **Do not** add protocol logic, or anything unrelated to device identity that
# can be written in pure Rust: that belongs to a downstream application. Code
# added here cannot be fuzzed, cannot run cross-platform in CI, and sits outside
# the protection of `forbid(unsafe_code)`.
#
# `unsafe_code` is `deny`, not `forbid`, and is narrowed per module by each
# platform backend (see `src/keystore/platform/windows.rs`).
# The crate root does not write `#![forbid(unsafe_code)]`, because platform FFI
# calls are inherently unsafe.

[dependencies]
# P-256: public key parsing and verification (public half), plus the software
# signer used by the `mock` backend.
#
# `ecdsa` provides `VerifyingKey` / `Signature` / `Verifier`; `std` lets the error
# types implement `std::error::Error`.
#
# The version must be 0.14: 0.13 depends on `sha2 ^0.10` and would pull in a
# second copy of SHA-2. It must also match the downstream `p256` version,
# otherwise one binary contains two P-256 implementations.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }

# SHA-256 has two uses: computing the device identity fingerprint, and turning a
# message into the digest the hardware signing API expects (the Windows CNG
# parameter is named `pbHashValue`).
sha2 = "0.11"

# Error types. Same major as downstream, to avoid two copies of thiserror.
thiserror = "2.0.21"

# OS CSPRNG. Used **only by the `mock` backend** to generate test private keys:
# real backends never need randomness, because keys are generated inside the TPM
# / Secure Enclave and the hardware supplies the entropy.
#
# Optional, because a production build should not carry it: without this path a
# user cannot accidentally end up with a software key.
getrandom = { version = "0.4.3", optional = true }

# Windows CNG (`NCrypt*`). `windows-sys` declares the import library symbols
# directly through `windows_link::link!`, so `LoadLibrary` / `GetProcAddress` are
# **not** needed, and neither is `libloading`.
#
# Only `Win32_Security_Cryptography` is enabled: it provides the full NCrypt and
# BCrypt surface. Do not enable other features -- `windows-sys` features are
# per-module switches, and extra ones noticeably increase compile time.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography"] }

# Android Keystore. Android has no C API for it: a key is created and used through
# `java.security` and `android.security.keystore`, so the calls are JNI calls into the
# JVM's own boot-class-path classes. No Java helper class is involved, or shipped.
#
# `invocation` provides `JavaVM::attach_current_thread`, which every call needs: the key
# store is reached from Rust threads the JVM has never seen.
#
# Only the Android target carries it; on any other target the module is not compiled.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false, features = ["invocation"] }

[features]
# Exposes the pure software in-memory keystore so upper layers can use it in
# their own tests.
#
# **Off by default.** Enabling it means a production build also carries a path
# with no hardware protection, and that path looks no different from the real
# one -- so it has to be an explicit choice.
mock = ["dep:getrandom"]

[dev-dependencies]
# Gives `cfg(test)` builds the same dependency as `--features mock`.
#
# The `mock` module is included by `cfg(any(test, feature = "mock"))`, so it is
# **always** compiled in a test build -- but its `getrandom` dependency does not
# come along (`cargo test` enables no feature). A plain dev-dependency covers it.
getrandom = "0.4.3"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_docs_in_private_items = "warn"
undocumented_unsafe_blocks = "deny"
